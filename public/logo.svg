<svg viewBox="0 0 460 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="svgNetworkGrad" x1="20" y1="130" x2="150" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0B2240" />
      <stop offset="35%" stopColor="#0E3A68" />
      <stop offset="65%" stopColor="#0096C7" />
      <stop offset="85%" stopColor="#00B4D8" />
      <stop offset="100%" stopColor="#00C2FF" />
    </linearGradient>

    <linearGradient id="svgArrowGrad" x1="75" y1="135" x2="165" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0284C7" />
      <stop offset="50%" stopColor="#00B4D8" />
      <stop offset="100%" stopColor="#00C2FF" />
    </linearGradient>
  </defs>

  <!-- Network lattice connectors (Deep Navy transitioning to Cyan) -->
  <line x1="32" y1="125" x2="42" y2="85" stroke="url(#svgNetworkGrad)" stroke-width="7" stroke-linecap="round" />
  <line x1="42" y1="85" x2="62" y2="40" stroke="url(#svgNetworkGrad)" stroke-width="7" stroke-linecap="round" />
  <line x1="32" y1="125" x2="82" y2="128" stroke="url(#svgNetworkGrad)" stroke-width="6.5" stroke-linecap="round" />
  <line x1="42" y1="85" x2="62" y2="80" stroke="url(#svgNetworkGrad)" stroke-width="5" stroke-linecap="round" />
  <line x1="42" y1="85" x2="82" y2="128" stroke="url(#svgNetworkGrad)" stroke-width="5.5" stroke-linecap="round" />
  <line x1="62" y1="40" x2="82" y2="128" stroke="url(#svgNetworkGrad)" stroke-width="6.5" stroke-linecap="round" />
  <line x1="62" y1="40" x2="90" y2="72" stroke="url(#svgNetworkGrad)" stroke-width="5.5" stroke-linecap="round" />
  <line x1="62" y1="80" x2="82" y2="128" stroke="url(#svgNetworkGrad)" stroke-width="5" stroke-linecap="round" />
  <line x1="62" y1="80" x2="105" y2="52" stroke="url(#svgNetworkGrad)" stroke-width="5.5" stroke-linecap="round" />
  <line x1="90" y1="72" x2="82" y2="128" stroke="url(#svgNetworkGrad)" stroke-width="5" stroke-linecap="round" />

  <!-- Ascending Arrow Shaft -->
  <line x1="82" y1="128" x2="140" y2="40" stroke="url(#svgArrowGrad)" stroke-width="9.5" stroke-linecap="round" />
  <line x1="105" y1="132" x2="148" y2="56" stroke="url(#svgArrowGrad)" stroke-width="8" stroke-linecap="round" />
  <line x1="82" y1="128" x2="105" y2="132" stroke="url(#svgArrowGrad)" stroke-width="6" stroke-linecap="round" />
  <line x1="105" y1="52" x2="136" y2="42" stroke="url(#svgArrowGrad)" stroke-width="6" stroke-linecap="round" />

  <!-- Dynamic Arrowhead -->
  <polygon points="126,14 168,34 144,62 142,44 120,36" fill="url(#svgArrowGrad)" />
  <polygon points="142,18 168,34 138,42" fill="#38BDF8" />

  <!-- Interconnected Spheres/Nodes -->
  <circle cx="32" cy="125" r="10" fill="#0B2240" />
  <circle cx="32" cy="125" r="4" fill="#FFFFFF" opacity="0.9" />

  <circle cx="42" cy="85" r="8.5" fill="#0B2240" />
  <circle cx="42" cy="85" r="3.2" fill="#FFFFFF" opacity="0.9" />

  <circle cx="62" cy="40" r="9.5" fill="#0B2240" />
  <circle cx="62" cy="40" r="3.8" fill="#FFFFFF" opacity="0.9" />

  <circle cx="62" cy="80" r="7.5" fill="#0B2240" />
  <circle cx="62" cy="80" r="2.8" fill="#FFFFFF" opacity="0.9" />

  <circle cx="82" cy="128" r="10" fill="#0B2240" />
  <circle cx="82" cy="128" r="4" fill="#FFFFFF" opacity="0.9" />

  <circle cx="105" cy="52" r="8.5" fill="#00B4D8" />
  <circle cx="105" cy="52" r="3.2" fill="#FFFFFF" />

  <circle cx="105" cy="132" r="7" fill="#00B4D8" />
  <circle cx="105" cy="132" r="2.5" fill="#FFFFFF" />

  <circle cx="125" cy="68" r="6.5" fill="#00C2FF" />
  <circle cx="125" cy="68" r="2.5" fill="#FFFFFF" />

  <!-- Typography: Njure TECH & Tagline -->
  <g transform="translate(195, 20)">
    <!-- Njure -->
    <text x="0" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#0B2240" letter-spacing="-1">Njure</text>
    
    <!-- TECH -->
    <text x="5" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#0B2240" letter-spacing="10">TECH</text>
    
    <!-- Tagline: A Njure Group Company -->
    <text x="5" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#0284C7" letter-spacing="0.5">A Njure Group Company</text>
  </g>
</svg>
